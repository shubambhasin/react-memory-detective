name: Release

# Publishing happens here and nowhere else.
#
# 0.1.0 and 0.1.1 were both published from a local working tree. 0.1.0 predated
# four known defects; 0.1.1 carried a package.json that npm had rewritten to
# declare ~200 dev packages as runtime dependencies, which made it fail to
# install on Linux. A clean checkout cannot have either problem: there is no
# stale node_modules for npm to reify, and nothing uncommitted to publish.
#
# Requires an npm automation token in the NPM_TOKEN repository secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.2)"
        required: true

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag must match package.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p 'require("./package.json").version')"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json ($PKG). Refusing to publish."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size budgets
        run: node scripts/size.mjs

      - name: Changelog entry must exist
        run: node scripts/changelog.mjs --check

      - name: Verify the package that will be published
        run: node scripts/verify-package.mjs

      - name: Manifest must still match the tag
        # npm can rewrite package.json while resolving; if it did so during any
        # step above, the artifact would no longer be what was reviewed.
        run: git diff --exit-code -- package.json package-lock.json

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify what actually landed on the registry
        # The backstop: check the published metadata, not the local artifact.
        #
        # Retries because the registry takes a little while to serve a new
        # version, and npm caches metadata locally — a check 10s after publish
        # returned E404 and failed a release that was in fact perfect. A gate
        # that cries wolf gets ignored, so an unreadable registry is reported as
        # unknown rather than as a failure; only metadata we can actually read
        # and that is actually wrong fails the run.
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          for attempt in 1 2 3 4 5 6; do
            if DEPS="$(npm view "react-render-detective@$VERSION" dependencies --json --prefer-online 2>/dev/null)"; then
              echo "published dependencies: ${DEPS:-<none>}"
              if [ -n "$DEPS" ] && [ "$DEPS" != "{}" ] && [ "$DEPS" != "undefined" ]; then
                echo "::error::Published $VERSION declares runtime dependencies. Deprecate it immediately:"
                echo "::error::npm deprecate react-render-detective@$VERSION \"Broken metadata, use a later version.\""
                exit 1
              fi
              echo "react-render-detective@$VERSION published with no runtime dependencies."
              exit 0
            fi
            echo "Registry has not served $VERSION yet (attempt $attempt); waiting."
            sleep 10
          done
          echo "::warning::Could not read $VERSION from the registry to verify it. The package was"
          echo "::warning::verified before publishing, so this is most likely propagation delay."
          echo "::warning::Confirm with: npm view react-render-detective@$VERSION dependencies --prefer-online"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Pull this version's section out of the changelog for the release body.
          awk -v v="## $VERSION" '$0 ~ "^"v"$" {f=1; next} f && /^## / {exit} f' CHANGELOG.md > /tmp/notes.md
          echo "" >> /tmp/notes.md
          echo "Install: \`npm install react-render-detective@$VERSION\`" >> /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
